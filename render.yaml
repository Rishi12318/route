databases:
  - name: fuel-optimizer-db
    plan: free

services:
  - type: web
    name: fuel-optimizer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fuel_optimizer.wsgi:application
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: fuel-optimizer-db
          property: connectionString