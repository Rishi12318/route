databases:
  - name: fuel-optimizer-db
    plan: free

services:
  - type: web
    name: fuel-optimizer
    env: python
    plan: free
    buildCommand: pip install -r fuel_optimizer/requirements.txt
    preDeployCommand: cd fuel_optimizer && python manage.py migrate --noinput
    startCommand: gunicorn fuel_optimizer.fuel_optimizer.wsgi:application --chdir fuel_optimizer
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: fuel-optimizer-db
          property: connectionString